<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Financiero & Agenda Ejecutiva</title>
  <link rel="apple-touch-icon" href="icono.png">
  <link rel="stylesheet" href="style.css">
  <!-- Tipografía ejecutiva -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Librería de Gráficos Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    
    <header>
      <h1>CONTROL EJECUTIVO</h1>
      <p id="fecha-actual"></p>
    </header>

    <!-- Pestañas de Navegación -->
    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('finanzas')">Finanzas</button>

      <button class="tab-btn" onclick="switchTab('agenda')">Agenda</button>
      <button class="tab-btn" onclick="switchTab('herramientas')">Herramientas</button>
    </nav>

    <!-- SECCIÓN 1: FINANZAS -->
    <main id="sec-finanzas" class="tab-content active">
      
      <!-- Dashboard Balance -->
      <section class="card">
        <div class="card-header-split">
          <h2>Balance General</h2>
          <button id="toggle-privacy" class="btn-icon" title="Ocultar Saldo">👁️</button>
        </div>
        <div class="total-monto privacy-blur" id="total-gastado">0,00 €</div>
        
        <!-- Barra de Presupuesto -->
        <div class="budget-container">
          <div class="budget-info">
            <span>Presupuesto Mensual (1.500 €)</span>
            <span id="budget-percent">0%</span>
          </div>
          <div class="budget-bar">
            <div id="budget-progress" class="budget-fill"></div>
          </div>
        </div>
      </section>

      <!-- Gráfico de Distribución -->
      <section class="card">
        <h2>Distribución por Categoría</h2>
        <div class="chart-wrapper">
          <canvas id="chart-gastos"></canvas>
        </div>
      </section>

      <!-- Formulario de Nuevo Gasto -->
      <section class="card">
        <h3>Nuevo Registro</h3>
        <form id="gasto-form">
          <input type="number" id="monto" placeholder="Monto (€)" step="0.01" required>
          <select id="categoria" required>
            <option value="" disabled selected>Categoría</option>
            <option value="Alimentación">Alimentación</option>
            <option value="Transporte">Transporte</option>
            <option value="Negocios">Negocios</option>
            <option value="Ocio">Ocio</option>
            <option value="Suscripciones">Suscripciones</option>
          </select>
          <button type="submit" class="btn-gold">Registrar Pago</button>
        </form>
      </section>

      <!-- Historial -->
      <section class="card">
        <div class="card-header-split">
          <h3>Movimientos</h3>
          <button onclick="exportarCSV()" class="btn-small">📥 CSV</button>
        </div>
        <ul id="lista-gastos" class="history-list"></ul>
      </section>

    </main>

    <!-- SECCIÓN 2: CALENDARIO Y AGENDA -->
    <main id="sec-agenda" class="tab-content">
      
      <!-- Calendario -->
      <section class="card">
        <div class="calendar-header">
          <button onclick="changeMonth(-1)">❮</button>
          <h2 id="calendar-month-year"></h2>
          <button onclick="changeMonth(1)">❯</button>
        </div>
        <div class="calendar-grid-header">
          <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
        </div>
        <div id="calendar-days" class="calendar-grid-days"></div>
      </section>

      <!-- Recordatorios -->
      <section class="card">
        <h3>Recordatorios & Citas</h3>
        <form id="reminder-form">
          <input type="text" id="rem-text" placeholder="Ej. Reunión de estrategia..." required>
          <input type="date" id="rem-date" required>
          <button type="submit" class="btn-gold">Añadir Recordatorio</button>
        </form>
        <ul id="lista-recordatorios" class="history-list" style="margin-top: 15px;"></ul>
      </section>

    </main>

    <!-- SECCIÓN 3: HERRAMIENTAS EXTRAS -->
    <main id="sec-herramientas" class="tab-content">
      
      <!-- Calculadora de Propinas / División de Cuentas -->
      <section class="card">
        <h2>Dividir Cuenta & Propinas</h2>
        <div class="calc-form">
          <label>Total de la cuenta (€)</label>
          <input type="number" id="calc-total" placeholder="0.00" step="0.01">
          
          <label>Personas</label>
          <input type="number" id="calc-people" value="1" min="1">
          
          <label>Propina (%)</label>
          <select id="calc-tip">
            <option value="0">0%</option>
            <option value="5">5%</option>
            <option value="10" selected>10% (Estándar)</option>
            <option value="15">15%</option>
          </select>

          <div class="calc-result">
            <span>Pago por persona:</span>
            <strong id="calc-per-person">0.00 €</strong>
          </div>
        </div>
      </section>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
<link rel="apple-touch-icon" href="icono.png">
